name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # packageManager field in package.json pins the pnpm version.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare types (wrangler types)
        run: pnpm cf-typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm prettier --check .

      - name: Unit tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (produces dist/ required by wrangler assets.directory)
        run: pnpm build

      # Resolve D1 database id dynamically from the account (via API token),
      # so deploys never break when the database is recreated and its UUID
      # changes. Falls back to the id committed in wrangler.jsonc.
      - name: Resolve D1 database id (create if missing, delete stale binding)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -o /tmp/d1.json -H "$AUTH" "$API"
          DB_ID=$(node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/d1.json","utf8"));
            if (!r.success) { console.error(r.errors); process.exit(0); }
            const db = r.result.find(d => d.name === "duit-db");
            if (db) console.log(db.uuid);
          ')
          if [ -z "$DB_ID" ]; then
            echo "duit-db not found in account; creating it..."
            curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"name":"duit-db"}' "$API" -o /tmp/create.json
            DB_ID=$(node -e '
              const r = JSON.parse(require("fs").readFileSync("/tmp/create.json","utf8"));
              if (r.success) console.log(r.result.uuid); else console.error(r.errors);
            ')
            if [ -z "$DB_ID" ]; then echo "::error::Failed to create duit-db"; exit 1; fi
          fi
          echo "Using duit-db id: $DB_ID"
          sed -i "s|\"database_id\": \"[^\"]*\"|\"database_id\": \"$DB_ID\"|" wrangler.jsonc
          grep database_id wrangler.jsonc
          # If the existing worker script holds a D1 binding pointing at a
          # deleted database, wrangler's version upload fails with code 10181.
          # Delete the stale binding first (data lives in D1, not the script;
          # assets are re-uploaded by deploy). This is idempotent.
          DEL_CODE=$(curl -sS -o /tmp/del.json -w "%{http_code}" -X DELETE \
            -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/duit/bindings/db")
          echo "Delete stale D1 binding HTTP: $DEL_CODE"
          head -c 300 /tmp/del.json; echo

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # (Guard against committed merge-conflict markers removed here — see PR #9 history.)
          # Sanity check: the D1 uuid currently configured must exist in this account.
          DB_ID=$(node -e "const s=require('fs').readFileSync('wrangler.jsonc','utf8');console.log(s.match(/\"database_id\":\s*\"([^\"]+)\"/)[1])")
          EXISTS=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).success?'yes':'no')}catch(e){console.log('no')}})")
          if [ "$EXISTS" != "yes" ]; then
            echo "::error::D1 database id $DB_ID does not exist in the account targeted by CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID. Check that the GitHub Secrets point to the same Cloudflare account that owns duit-db."
            exit 1
          fi
          echo "D1 database $DB_ID verified present in account. Deploying..."
          pnpm exec wrangler deploy

      # Note: PASSWORD_PEPPER is a worker secret — set once out of band via
      # `wrangler secret put PASSWORD_PEPPER` (or the Cloudflare dashboard).
      # It is intentionally NOT wired through this workflow.
