name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # packageManager field in package.json pins the pnpm version.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare types (wrangler types)
        run: pnpm cf-typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm prettier --check .

      - name: Unit tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (produces dist/ required by wrangler assets.directory)
        run: pnpm build

      # Resolve D1 database id dynamically from the account (via API token),
      # so deploys never break when the database is recreated and its UUID
      # changes. Falls back to the id committed in wrangler.jsonc.
      - name: Resolve D1 database id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_JSON=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          echo "$DB_JSON" > /tmp/d1.json
          DB_ID=$(node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/d1.json","utf8"));
            if (!r.success) { console.error("Cloudflare API error:", JSON.stringify(r.errors)); process.exit(0); }
            const db = r.result.find(d => d.name === "duit-db");
            if (db) console.log(db.uuid);
          ')
          if [ -n "$DB_ID" ]; then
            echo "Found duit-db with id: $DB_ID"
            sed -i "s|\"database_id\": \"[^\"]*\"|\"database_id\": \"$DB_ID\"|" wrangler.jsonc
          else
            echo "Could not resolve duit-db via API; using committed database_id."
          fi
          grep database_id wrangler.jsonc

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --test-skip-cron-validation

      # Note: PASSWORD_PEPPER is a worker secret — set once out of band via
      # `wrangler secret put PASSWORD_PEPPER` (or the Cloudflare dashboard).
      # It is intentionally NOT wired through this workflow.
